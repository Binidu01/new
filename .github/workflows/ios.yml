# Auto-generated by bini-deploy - do not edit.
# Regenerated every time you run `pnpm run deploy`.
name: Bini iOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: swatinem/rust-cache@v2.7.5
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize iOS project (if missing)
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            pnpm run tauri ios init --ci
          fi

      - name: Generate app icons
        run: pnpm run tauri:icon

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -eu
          version="$(jq -r '.version // empty' package.json)"
          if [ -z "$version" ]; then
            echo "::error title=Version not found::package.json has no version field."
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build iOS app
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_DEVELOPMENT_TEAM" ]; then unset APPLE_DEVELOPMENT_TEAM; fi
          if [ -n "$APPLE_API_KEY_P8" ]; then
            key_path="$RUNNER_TEMP/AuthKey.p8"
            echo "$APPLE_API_KEY_P8" | base64 --decode > "$key_path"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          fi
          if [ -n "$IOS_CERTIFICATE" ] && [ -n "$IOS_CERTIFICATE_PASSWORD" ] && [ -n "$IOS_MOBILE_PROVISION" ]; then
            pnpm run ios:build --export-method app-store-connect
          elif [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_DEVELOPMENT_TEAM" ]; then
            echo "Using Xcode automatic signing with the App Store Connect API key."
            pnpm run ios:build --export-method app-store-connect
          else
            echo "No iOS signing secrets found: building for the simulator only."
            unset IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD IOS_MOBILE_PROVISION
            tmp="$(mktemp)"
            jq 'del(.bundle.iOS.developmentTeam)' src-tauri/tauri.conf.json > "$tmp"
            mv "$tmp" src-tauri/tauri.conf.json
            pnpm run ios:build --target aarch64-sim --debug
          fi

      - uses: actions/upload-artifact@v4.4.3
        with:
          name: ios
          path: src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: warn

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2.0.9
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            src-tauri/gen/apple/build/**/*.ipa
